2fa:
  not-registered: '&#ff0000You do not have a {0} account.'
  already-registered: '&#ff0000You have already registered your {0}.'
  register-limit: '&#ff0000You have exhausted the limits of accounts with the same {0}.'
  unregistered: '&#ff0000Your {0} was successfully unregistered.'
  incorrect-code: '&#ff0000Incorrect code. Please try again.'
  rate-limit: '&#ff0000Limit exceeded. Please wait {0} minutes to try again.'
  confirmed-account: '&aYour {0} account has been successfully registered.'
  confirmation-message-sent: |-
    &7A confirmation code was sent to your &6{0}&7.
    &8(&f{1}&8).
  command-delay: '&#ff0000Wait a while before executing this command again.'
  help-command:
  - ''
  - ' &fStatus: [&a{2} registered//&#ff0000{2} not registered]&f.'
  - ''
  - ' [&8⋆ &7/{0} add: &fRegister your {1}.]'
  - ' [&8⋆ &7/{0} remove: &fRemove your {1}.]'
  - ' [&8⋆ &7/{0} recover: &fRecover your account.]'
  - ' [&8⋆ &7/{0} 2fa: &fEnables/disables the two-factor.]'
  - ''
  recover-command:
  - ''
  - ' &#ff0000Choose a recovery method:'
  - ' [&8⋆ &7{0}: &f/{1} recover]'
  - ''
  switch:
    enabled: '&aThe two-factor feature has been activated.'
    disabled: '&#ff0000The two-factor feature has been deactivated.'
  recover:
    not-equal: '&#ff0000The {0} provided is not the same as the registered one.'
    message-sent: '&aA recovery message was sent to your associated account.'
    change-password: '&aYour password was automatically changed to &f''{0}''&a.'
  discord:
    account-linked: |-
      &aConfiguration in Discord successfully updated.
      &aYou have been linked with &f{0} &aaccount.
    confirm-account:
    - ''
    - ' &7To complete the linking, you need to confirm your Discord account.'
    - ' &7Join to &b{0} &7and type'
    - ' &7the command in the DM of the &f{1} &7bot.'
    - ''
    - ' [&aClick here to get the command with the token.]'
    - ''
    warn-message:
    - ''
    - ' &7Perform the command &f/discord add &7to register'
    - ' &7your &9Discord&7. By doing so, you'
    - ' &7decrease the chance of being hacked.'
    - ''
    discord-required:
    - ''
    - ' &7The current server requires you to link a'
    - ' &aDiscord account &7to complete registration.'
    - ''
    - ' &6Please run &f/discord add&6.'
    - ''
    address-changed:
    - ''
    - ' &7You need to confirm your account login.'
    - ' &7A security message has been sent to your registered Discord.'
    - ''
    - ' &aClick the message button to confirm your identity.'
    - ''
    dm:
      configure:
        too-recent:
          title: Too recent account
          description: You can't link your Discord because your account was created too recently.
          image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
          color: '#808080'
        invalid:
          title: Invalid code
          description: Sorry, but the token you entered is invalid or does not exist.
          image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
          color: '#808080'
        success:
          title: Discord linked
          description: Your Discord has been linked successfully.
          image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
          color: '#808080'
      verify:
        title: Confirm your account authentication.
        description: |-
          Authentication confirmation is required to access your @player account.

          If it wasn't you, deny the operation and change your password immediately.
        image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
        color: '#808080'
        allow: Allow
        deny: Deny
      recover:
        title: Password recovery requested.
        description: |-
          A password recovery request has been requested from your @player account.

          If it wasn't you, deny the operation and change your password immediately.
        image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
        color: '#808080'
        allow: Allow
        deny: Deny
      new-password:
        title: New password for @player
        description: |-
          A new password has been generated for your account:
          `{0}`
        image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
        color: '#808080'
      password-changed:
        title: Password changed for @player
        description: |-
          Your password has been changed to:
          `{0}`
        image: https://www.nickuc.com/static/assets/img/2fa-lock-default.png
        color: '#808080'
  email:
    invalid-email: '&#ff0000The entered email is invalid.'
    not-allowed: '&#ff0000The domain of the chosen email is not allowed.'
    server-email: '&#ff0000You cannot use the server''s email.'
    warn-message:
    - ''
    - ' &7Perform the command &f/email associate &7to register'
    - ' &7your &9email&7. By doing so, you'
    - ' &7decrease the chance of being hacked.'
    - ''
    email-required:
    - ''
    - ' &7The current server requires you to link a'
    - ' &avalid email &7to complete registration.'
    - ''
    - ' &6Please run &f/email add <your email>&6.'
    - ''
    address-changed:
    - ''
    - ' &7You need to confirm your account login.'
    - ' &7A security message has been sent to your registered email.'
    - ''
    - ' &aUse the command &f/email <code> &ato complete the authentication.'
    - ''
    smtp:
      configure:
        subject: Confirmation of the account @player
        content:
        - <h1>
        - ' Hello, @player!'
        - </h1>
        - <p>
        - ' To complete your email registration process, use the command <strong>"/email @code"</strong>.'
        - </p>
        - <p>
        - ' If it wasn''t you, ignore this message.'
        - </p>
      verify:
        subject: Login confirmation of the account @player
        content:
        - <h1>
        - ' Hello, @player!'
        - </h1>
        - <p>
        - ' To authenticate on the server, use the command <strong>"/email @code"</strong>.'
        - </p>
        - <p>
        - ' If it was not you, change your password <strong>IMMEDIATELY</strong>.'
        - </p>
      recover:
        subject: Recovering the account @player
        content:
        - <h1>
        - ' Hello, @player!'
        - </h1>
        - <p>
        - ' To recover your account, use the command <strong>"/email <new password> @code"</strong>.'
        - </p>
        - <p>
        - ' If it wasn''t you, disregard this message.'
        - </p>
      new-password:
        subject: New password for @player
        content:
        - <h1>
        - ' Hi, @player!'
        - </h1>
        - <p>
        - ' A new password has been generated for your account: {0}'
        - </p>
      password-changed:
        subject: Password changed for @player
        content:
        - <h1>
        - ' Hi, @player!'
        - </h1>
        - <p>
        - ' Your password has been changed to: {0}'
        - </p>

