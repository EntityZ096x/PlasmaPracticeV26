# =====================================================================
#  Automatic pricing
# =====================================================================

auto-pricing:

  enabled: true

  default-price: 0.125

  default-category: natural

  never-sell:
    - 'maelstrom'

  rules:
    - contains: ['netherite']
      price: 500
      category: ores
    - contains: ['diamond']
      price: 75
      category: ores
    - contains: ['emerald']
      price: 50
      category: ores
    - contains: ['smithing template']
      price: 100
      category: armor
    - contains: ['music disc']
      price: 15
      category: blocks
    - contains: ['shulker']
      price: 30
      category: mobs
    - contains: ['head', 'skull']
      price: 50
      category: mobs
    - contains: ['gold']
      price: 10
      category: ores
    - contains: ['iron']
      price: 6
      category: ores
    - contains: ['copper']
      price: 2
      category: ores
    - contains: ['wool', 'banner', 'bed']
      price: 1.5
      category: blocks
    - contains: ['coral', 'candle']
      price: 1.5
      category: natural
    - contains: ['concrete', 'terracotta', 'glass', 'sapling', 'seeds', 'boat', 'sign', 'door', 'fence', 'stairs', 'slab', 'carpet', 'dye']
      price: 1
      category: blocks
