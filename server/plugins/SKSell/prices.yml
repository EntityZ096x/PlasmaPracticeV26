# =====================================================================
#  Automatic pricing
# =====================================================================
#  Minecraft has well over a thousand items and the list above covers a
#  couple of hundred. Everything left over is priced here by keyword, so
#  a player who brings you a stack of pink candles is not told "this
#  cannot be sold" for no reason.
#
#  Turn this off and only the items listed above are sellable - which is
#  the right choice if you want to control the economy item by item.
#
#  CRAFTED ITEMS NEVER PAY MORE THAN WHAT THEY ARE MADE FROM
#  An automatic price is lowered to the item's share of its cheapest
#  recipe (crafting table, stonecutter, furnace), rounded down: a slab is
#  half a block, a glass pane 6/16 of a glass block, iron bars 6/16 of an
#  iron ingot. Without that, crafting would be a money printer - one block
#  into two slabs at 2 each, one ingot into nine nuggets. The console
#  says how many prices this lowered when the plugin starts.
#  The other way round, an automatic price is raised to what the item
#  turns into on its own: a dried kelp block pays its nine dried kelp, a
#  raw iron block its nine raw iron.
#  Prices you list yourself above are never changed. Give a part a line
#  there if you want it to pay more.
#
#  Potions pay by what is inside: a water bottle (and an awkward, mundane
#  or thick potion) at most what a glass bottle pays, a brewed potion at
#  most its bottle and ingredients. POTION above is the most any potion
#  pays.
# =====================================================================
auto-pricing:

  enabled: true

  # Price for an item that matches no rule below.
  default-price: 0.25

  # Category an item lands in when its rule names none.
  # Must be one of the category keys above.
  default-category: natural

  # Items whose name contains any of these are never given a price.
  # This is the "not obtainable in survival" list: command blocks, spawn
  # eggs, barriers and friends. Selling those would let anyone with
  # creative access print money.
  # Matching is on the material name in lower case with underscores as
  # spaces, so 'spawn egg' matches ZOMBIE_SPAWN_EGG.
  never-sell:
    - 'maelstrom'

  # The rules, checked top to bottom - the FIRST match wins, so put the
  # expensive keywords first. 'netherite' before 'iron' matters, because
  # NETHERITE_UPGRADE_SMITHING_TEMPLATE contains neither, while
  # NETHERITE_AXE contains 'netherite' only.
  #
  #   contains:  any of these words in the material name
  #   price:     what one item is worth
  #   category:  which multiplier track it feeds
  rules:
    - contains: ['netherite']
      price: 1000
      category: ores
    - contains: ['diamond']
      price: 150
      category: ores
    - contains: ['emerald']
      price: 100
      category: ores
    - contains: ['smithing template']
      price: 200
      category: armor
    - contains: ['music disc']
      price: 30
      category: blocks
    - contains: ['shulker']
      price: 60
      category: mobs
    - contains: ['head', 'skull']
      price: 100
      category: mobs
    - contains: ['gold']
      price: 20
      category: ores
    - contains: ['iron']
      price: 12
      category: ores
    - contains: ['copper']
      price: 4
      category: ores
    - contains: ['wool', 'banner', 'bed']
      price: 3
      category: blocks
    - contains: ['coral', 'candle']
      price: 3
      category: natural
    - contains: ['concrete', 'terracotta', 'glass', 'sapling', 'seeds', 'boat', 'sign', 'door', 'fence', 'stairs', 'slab', 'carpet', 'dye']
      price: 2
      category: blocks
